<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ארץ עיר - סבא עופר</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --primary: #4a90e2; --secondary: #f5a623; --success: #7ed321; --danger: #d0021b; --bg: #f0f4f8; --text: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; direction: rtl;}
        .container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 95%; max-width: 800px; text-align: center; }
        .screen { display: none; flex-direction: column; } .active { display: flex; }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 1.1rem; }
        button { cursor: pointer; border: none; border-radius: 10px; padding: 12px 24px; font-size: 1.2rem; font-weight: bold; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-home { background: #95a5a6; color: white; margin-top: 20px; }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .leaderboard-table th, .leaderboard-table td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        .category-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .category-row label { width: 120px; font-weight: bold; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <div id="welcome" class="screen active">
        <h1>ארץ עיר של סבא עופר - שיפוט AI</h1>
        <input type="text" id="player-name" placeholder="השם שלך...">
        <button class="btn-primary" onclick="startSoloGame()">שחק נגד השעון</button>
        <button class="secret-btn" onclick="promptAdmin()" style="opacity: 0.2; margin-top: 50px;">סיסמה</button>
    </div>

    <div id="game-screen" class="screen">
        <h2 id="game-letter-header">האות היא:</h2>
        <div id="categories-container"></div>
        <button class="btn-primary" onclick="submitGame()">סיימתי!</button>
    </div>

    <div id="results" class="screen">
        <h2>תוצאות המשחק</h2>
        <div id="answers-comparison-container"></div>
        <button class="btn-primary" onclick="showSummary()">סיום וקבלת התוצאות 📊</button>
        <button class="btn-home" onclick="location.reload()">חזור למסך הבית 🏠</button>
    </div>

    <div id="summary-screen" class="screen">
        <h2>🏆 סיכום המשחקים שלך</h2>
        <div id="summary-tables"></div>
        <button class="btn-primary" onclick="location.reload()">שחק שוב</button>
        <button class="btn-home" onclick="location.reload()">חזור למסך הבית 🏠</button>
    </div>

    <div id="admin-screen" class="screen">
        <h2>🛠️ מתחם מנהל</h2>
        <div id="admin-history"></div>
        <button class="btn-primary" onclick="location.reload()">חזור</button>
        <button class="btn-danger" style="background:red; color:white;" onclick="clearHistory()">מחק הכל</button>
    </div>
</div>

<script>
    const RAW_DATA = {
        localities: `גבעתיים,תל אביב,ירושלים,חיפה,ראשון לציון,פתח תקווה,אשדוד,נתניה,באר שבע,חולון,בני ברק,רמת גן,אשקלון,רחובות,בת ים,בית שמש,הרצליה,כפר סבא,חדרה,לוד,רעננה,מודיעין,רמלה`,
        boys: `זאביק,למך,גרישה,עופר,דוד,אברהם,משה,יעקב,יצחק`,
        girls: `אזמרלדה,אלה,ליה,דינה,דנה,שרה,רבקה`,
        professions: `אפסנאי,רפתן,לבלר,לוביסט,גבאי,בוטניקאי,רופא,עורך דין,מתכנת`,
        foods: `אפרסק,תפוח,בננה,עגבניה,מלפפון,לחם,גבינה`,
        countries: `זאיר,ישראל,צרפת,ארה"ב,אנגליה,גרמניה`
    };

    const CATEGORIES = [
        { id: 'countries', label: 'מדינה' },
        { id: 'localities', label: 'יישוב בישראל' },
        { id: 'foods', label: 'מאכל' },
        { id: 'boys', label: 'שם בן' },
        { id: 'girls', label: 'שם בת' },
        { id: 'professions', label: 'מקצוע' }
    ];

    let currentLetter = '', myName = '', playerAnswers = {};
    const socket = io();

    function startSoloGame() {
        myName = document.getElementById('player-name').value.trim() || "שחקן";
        currentLetter = "אבגדהזחטיכלמנסעפצקרשת"[Math.floor(Math.random()*22)];
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('game-letter-header').innerText = "האות היא: " + currentLetter;
        const container = document.getElementById('categories-container');
        container.innerHTML = '';
        CATEGORIES.forEach(cat => {
            container.innerHTML += `<div class="category-row"><label>${cat.label}</label><input type="text" id="input-${cat.id}"></div>`;
        });
    }

    async function submitGame() {
        let score = 0;
        playerAnswers = {};
        let itemsToJudge = [];

        for (let cat of CATEGORIES) {
            const val = document.getElementById(`input-${cat.id}`).value.trim();
            const localList = RAW_DATA[cat.id].split(',');
            if (localList.includes(val) && val.startsWith(currentLetter)) {
                playerAnswers[cat.label] = { val, points: 10, feedback: "מאושר מקומית" };
                score += 10;
            } else if (val.startsWith(currentLetter)) {
                itemsToJudge.push({ catId: cat.id, categoryLabel: cat.label, answer: val });
                playerAnswers[cat.label] = { val, points: 0, feedback: "בדיקת AI..." };
            } else {
                playerAnswers[cat.label] = { val, points: 0, feedback: "אות שגויה/ריק" };
            }
        }

        if (itemsToJudge.length > 0) {
            const res = await fetch('/api/ask-judge-batch', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ letter: currentLetter, items: itemsToJudge })
            });
            const data = await res.json();
            for (let item of itemsToJudge) {
                const ai = data.results[item.catId];
                if (ai) { playerAnswers[item.categoryLabel].points = ai.points; playerAnswers[item.categoryLabel].feedback = ai.reason; score += ai.points; }
            }
        }

        const record = { date: new Date().toLocaleDateString('he-IL'), time: new Date().toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'}), letter: currentLetter, players: [{ name: myName, score }] };
        socket.emit('logSinglePlayerHistory', { historyRecord: record, fullAnswers: playerAnswers });
        
        // שמירה לסיכום המצטבר
        let history = JSON.parse(sessionStorage.getItem('myHistory') || '[]');
        history.push(record);
        sessionStorage.setItem('myHistory', JSON.stringify(history));

        showResults(score);
    }

    function showResults(score) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('results').classList.add('active');
        let html = `<table class="leaderboard-table"><thead><tr><th>קטגוריה</th><th>תשובה</th><th>נקודות</th><th>נימוק</th></tr></thead><tbody>`;
        for (let cat in playerAnswers) {
            const a = playerAnswers[cat];
            html += `<tr><td>${cat}</td><td>${a.val}</td><td>${a.points}</td><td>${a.feedback}</td></tr>`;
        }
        html += "</tbody></table>";
        document.getElementById('answers-comparison-container').innerHTML = html;
    }

    function showSummary() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('summary-screen').classList.add('active');
        const history = JSON.parse(sessionStorage.getItem('myHistory') || '[]');
        let html = `<table class="leaderboard-table"><thead><tr><th>תאריך</th><th>אות</th><th>ציון</th></tr></thead><tbody>`;
        let total = 0;
        history.forEach(r => {
            html += `<tr><td>${r.date} ${r.time}</td><td>${r.letter}</td><td>${r.players[0].score}</td></tr>`;
            total += r.players[0].score;
        });
        html += `</tbody></table><h3>ממוצע: ${(total/history.length).toFixed(1)}</h3>`;
        document.getElementById('summary-tables').innerHTML = html;
    }

    function promptAdmin() {
        if (prompt("סיסמה:") === "99787") {
            socket.emit('getAdminData');
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('admin-screen').classList.add('active');
        }
    }

    socket.on('receiveAdminData', (data) => {
        let local = JSON.parse(localStorage.getItem('adminVault') || '[]');
        data.history.forEach(h => { if(!local.find(l => l.date===h.date && l.time===h.time)) local.push(h); });
        localStorage.setItem('adminVault', JSON.stringify(local));
        socket.emit('restoreAdminData', { history: local });

        let html = `<table class="leaderboard-table"><thead><tr><th>זמן</th><th>אות</th><th>שחקנים</th></tr></thead><tbody>`;
        local.reverse().forEach(h => {
            html += `<tr><td>${h.date}<br>${h.time}</td><td>${h.letter}</td><td>${h.players.map(p=>`${p.name}(${p.score})`).join(', ')}</td></tr>`;
        });
        document.getElementById('admin-history').innerHTML = html + "</tbody></table>";
    });

    function clearHistory() { if(confirm("למחוק?")) { localStorage.removeItem('adminVault'); socket.emit('clearGameHistory'); } }
</script>
</body>
</html>
